<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="text-white text-center py-4">
        <h1>Cadastro de Usuário</h1>
        <p class="mb-0">Preencha os dados para realizar seu cadastro</p>
    </header>

    <main class="container my-5">
        <div class="card shadow-sm">
            <div class="card-header">
                <h2 class="h4 mb-0">Dados pessoais</h2>
            </div>

            <div class="card-body">
                <form id="formCadastro">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" required>
                        </div>

                        <div class="col-md-6">
                            <label for="sobrenome" class="form-label">Sobrenome</label>
                            <input type="text" class="form-control" id="sobrenome" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="col-md-6">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senha"
                                   minlength="6" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h2 class="h4 mb-3">Endereço</h2>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="cep" class="form-label">CEP</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="cep"
                                       placeholder="00000-000" maxlength="9" required>
                                <button type="button" class="btn btn-outline-primary"
                                        id="consultarCep">Buscar CEP</button>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <label for="rua" class="form-label">Rua</label>
                            <input type="text" class="form-control" id="rua" required>
                        </div>

                        <div class="col-md-5">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" class="form-control" id="bairro" required>
                        </div>

                        <div class="col-md-5">
                            <label for="cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="cidade" required>
                        </div>

                        <div class="col-md-2">
                            <label for="estado" class="form-label">Estado</label>
                            <input type="text" class="form-control" id="estado"
                                   maxlength="2" placeholder="UF" required>
                        </div>

                        <div class="col-md-4">
                            <label for="numero" class="form-label">Número</label>
                            <input type="text" class="form-control" id="numero" required>
                        </div>

                        <div class="col-md-8">
                            <label for="complemento" class="form-label">Complemento</label>
                            <input type="text" class="form-control" id="complemento"
                                   placeholder="Apartamento, casa, bloco...">
                        </div>
                    </div>

                    <div id="mensagem" class="mt-3" role="status" aria-live="polite"></div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            Cadastrar usuário
                        </button>
                        <button type="reset" class="btn btn-secondary">
                            Limpar formulário
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">Atividade 3 — Formulário de Cadastro de Usuário</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
