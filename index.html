```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de CEP</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Consulta de CEP</h1>
        <p>Encontre informações de endereço de forma rápida e simples.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Consultar endereço</h2>

            <form id="formulario-cep">
                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="Digite o CEP (ex.: 01001-000)"
                        maxlength="9"
                        required
                    >
                </div>

                <button type="submit" id="btn-consultar">
                    Consultar CEP
                </button>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Dados do endereço</h2>

            <div class="campo">
                <label for="logradouro">Rua / Logradouro:</label>
                <input type="text" id="logradouro" readonly>
            </div>

            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" readonly>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" readonly>
            </div>

            <div class="campo">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" readonly>
            </div>

            <div class="campo">
                <label for="complemento">Complemento:</label>
                <input type="text" id="complemento" readonly>
            </div>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico — Consulta de CEP utilizando HTML, CSS e JavaScript.</p>
        <p>Dados de endereço fornecidos pela API ViaCEP.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
```
