<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Consulta de CEP</h1>
        <p>Consulte endereços brasileiros pelo CEP usando a API ViaCEP.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Pesquisar endereço</h2>

            <form id="formulario-cep">
                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        placeholder="Ex.: 01001-000"
                        maxlength="9"
                        autocomplete="postal-code"
                        required
                    >
                </div>

                <button type="submit">Consultar CEP</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>

        <section class="card" id="resultado" hidden>
            <h2>Endereço encontrado</h2>

            <div class="campo">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" readonly>
            </div>

            <div class="campo">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" readonly>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" readonly>
            </div>

            <div class="campo">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" readonly>
            </div>
        </section>

    </main>

    <footer>
        <p>Projeto acadêmico — Consulta de CEP</p>
        <p>Dados fornecidos pela API ViaCEP.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
